<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Coyote | Atención Comunitaria</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #fefce8; color: #422006; margin: 0; padding: 15px; }
        .container { max-width: 760px; margin: auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 3px 10px rgba(0,0,0,0.08); border-top: 5px solid #ca8a04; }
        h2 { color: #854d0e; margin-top: 0; text-align: center; }
        .sub { text-align: center; font-size: 12px; color: #713f12; margin-bottom: 15px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr 2fr; gap: 10px; margin-bottom: 10px; }
        @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
        label { display: block; font-size: 11px; font-weight: bold; margin-bottom: 3px; }
        input, select { width: 100%; padding: 8px; border: 1px solid #fde047; border-radius: 5px; box-sizing: border-box; font-size: 13px; }
        button { padding: 9px 14px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; color: #fff; font-size: 13px; }
        .btn-crear { background: #a16207; width: 100%; }
        .filter-bar { margin: 15px 0; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; background: #fef9c3; padding: 8px 12px; border-radius: 6px; }
        .reporte-card { border: 1px solid #fef08a; background: #fffbeb; padding: 12px; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
        .badge { padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
        .st-Abierto { background: #fee2e2; color: #991b1b; }
        .st-Proceso { background: #fef3c7; color: #92400e; }
        .st-Resuelto { background: #dcfce7; color: #166534; }
    </style>
</head>
<body>
<div class="container">
    <h2>🏘️ Plataforma Coyote: Reportes y Servicios Comunitarios</h2>
    <div class="sub">Ejido Coyote, Coahuila • Desarrollo Web Grupo 502</div>

    <div class="form-grid">
        <div>
            <label>Categoría de Servicio:</label>
            <select id="catServicio">
                <option value="Alumbrado Público">Alumbrado Público</option>
                <option value="Agua Potable / Fugas">Agua Potable / Fugas</option>
                <option value="Bacheo y Vialidad">Bacheo y Vialidad</option>
                <option value="Limpieza y Espacios">Limpieza y Espacios</option>
            </select>
        </div>
        <div>
            <label>Ubicación / Sector:</label>
            <input type="text" id="ubicacion" placeholder="Ej. Calle Hidalgo #12">
        </div>
        <div>
            <label>Descripción del Reporte:</label>
            <input type="text" id="detalle" placeholder="Describe brevemente la situación...">
        </div>
    </div>
    <button class="btn-crear" onclick="crearReporte()">+ Generar Folio de Reporte</button>

    <div class="filter-bar">
        <strong style="font-size:12px;">Filtrar por estatus:</strong>
        <select id="filtroEstatus" onchange="renderReportes()" style="width:auto;">
            <option value="Todos">Todos los reportes</option>
            <option value="Abierto">Abierto</option>
            <option value="Proceso">En Proceso</option>
            <option value="Resuelto">Resuelto</option>
        </select>
    </div>

    <div id="listaReportes"></div>
</div>

<script>
    function getReps() { return JSON.parse(localStorage.getItem("coyote_servicios_502")) || []; }
    function setReps(d) { localStorage.setItem("coyote_servicios_502", JSON.stringify(d)); }

    function crearReporte() {
        const cat = document.getElementById("catServicio").value;
        const ubi = document.getElementById("ubicacion").value.trim();
        const det = document.getElementById("detalle").value.trim();

        if (!ubi || !det) {
            alert("Indica la ubicación y la descripción del reporte.");
            return;
        }

        const lista = getReps();
        const folio = "CY-" + (100 + lista.length + 1);
        lista.unshift({ id: Date.now(), folio, cat, ubi, det, estatus: "Abierto" });
        setReps(lista);

        document.getElementById("ubicacion").value = "";
        document.getElementById("detalle").value = "";
        renderReportes();
    }

    function avanzarEstatus(id) {
        const lista = getReps();
        const item = lista.find(r => r.id === id);
        if (!item) return;
        if (item.estatus === "Abierto") item.estatus = "Proceso";
        else if (item.estatus === "Proceso") item.estatus = "Resuelto";
        else item.estatus = "Abierto";
        setReps(lista);
        renderReportes();
    }

    function borrarReporte(id) {
        if (confirm("¿Eliminar este folio de reporte?")) {
            setReps(getReps().filter(r => r.id !== id));
            renderReportes();
        }
    }

    function renderReportes() {
        const filtro = document.getElementById("filtroEstatus").value;
        let lista = getReps();
        if (filtro !== "Todos") lista = lista.filter(r => r.estatus === filtro);

        const box = document.getElementById("listaReportes");
        box.innerHTML = lista.length ? "" : "<p style='text-align:center; color:#78716c;'>No hay reportes registrados en esta categoría.</p>";

        lista.forEach(r => {
            box.innerHTML += `
                <div class="reporte-card">
                    <div>
                        <strong>[${r.folio}] ${r.cat}</strong> — <span class="badge st-${r.estatus}">${r.estatus === 'Proceso' ? 'En Proceso' : r.estatus}</span><br>
                        <small>📍 <strong>Ubicación:</strong> ${r.ubi} | 📝 ${r.det}</small>
                    </div>
                    <div style="display:flex; gap:5px;">
                        <button onclick="avanzarEstatus(${r.id})" style="background:#0284c7; padding:5px 9px; font-size:11px;">Cambiar Estatus</button>
                        <button onclick="borrarReporte(${r.id})" style="background:#dc2626; padding:5px 9px; font-size:11px;">X</button>
                    </div>
                </div>`;
        });
    }
    renderReportes();
</script>
</body>
</html>
